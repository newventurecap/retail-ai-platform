[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "returns-agent"
version = "0.1.0"
description = "Returns Resolution Agent (demo on synthetic data and simulated enterprise APIs)"
requires-python = ">=3.11"
dependencies = ["retail-ai-platform[azure]>=0.1", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
returns_agent = ["data/*.json"]
