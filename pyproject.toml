[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-ai-platform"
version = "0.1.0"
description = "Shared foundation for building retail AI agents on Azure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "azure-identity>=1.17",
    "azure-search-documents>=11.6",
    "httpx>=0.27",
    "langgraph>=0.2",
    "opentelemetry-api>=1.25",
    "fastapi>=0.110",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
azure = ["azure-monitor-opentelemetry>=1.6"]
foundry = ["azure-ai-evaluation>=1.0"]
dev = ["uvicorn>=0.30", "pytest>=8", "ruff>=0.5", "opentelemetry-sdk>=1.25"]

# The folder is `platform/` (it would shadow the stdlib module if imported
# under that name), so it is published and imported as `retail_ai`.
[tool.setuptools]
packages = [
    "retail_ai",
    "retail_ai.models",
    "retail_ai.identity",
    "retail_ai.observability",
    "retail_ai.retrieval",
    "retail_ai.integrations",
    "retail_ai.agents",
    "retail_ai.evaluation",
    "retail_ai.service",
]

[tool.setuptools.package-dir]
retail_ai = "platform"

[tool.pytest.ini_options]
testpaths = ["tests", "applications/returns-agent/tests"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
